kind = "web"
previewPath = "/"
title = "Word Agents"
description = "A multiplayer word-clue game for two teams. Players join a shared room on their own devices; each sees only their role's view, with the secret map sent to spymasters alone."
version = "1.0.0"
id = "artifacts/word-agents"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22021

[services.development]
run = "pnpm --filter @workspace/word-agents run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/word-agents", "run", "build" ]
serve = "static"
publicDir = "artifacts/word-agents/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22021"
BASE_PATH = "/"
