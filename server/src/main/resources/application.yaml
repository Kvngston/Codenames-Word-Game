server:
  port: ${PORT:8080}
  shutdown: graceful
  # Caddy sets X-Forwarded-For; Tomcat trusts it only from private-network proxies,
  # so request.getRemoteAddr() is the real client for rate limiting.
  forward-headers-strategy: native

spring:
  application:
    name: word-agents
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/wordagents}
    username: ${DATABASE_USERNAME:wordagents}
    password: ${DATABASE_PASSWORD:wordagents}
  jpa:
    open-in-view: false
    hibernate:
      # Liquibase owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      # Liquibase creates BOOLEAN columns as MySQL's TINYINT(1); map booleans to match.
      hibernate.type.preferred_boolean_jdbc_type: TINYINT
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  # Actuator runs on its own port, which Caddy doesn't proxy: only Prometheus on
  # the private Compose network can read it.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: word-agents
    distribution:
      # Histogram buckets so Prometheus can compute p95/p99 across instances.
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s
      slo:
        # Extra buckets at the latency targets the alerts use.
        http.server.requests: 100ms, 250ms, 500ms, 1s

app:
  # The release tag being served; set by deploy/ci-deploy.sh through release.env.
  version: ${APP_VERSION:dev}
  # Comma-separated origins allowed to call the API and open the WebSocket,
  # e.g. https://your-app.vercel.app
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:22021}
  room-idle-hours: 24
  # Per client IP: up to `burst` requests at once, then one more `every`.
  # Classrooms and offices share one IP, so keep bursts generous.
  rate-limits:
    enabled: ${RATE_LIMITS_ENABLED:true}
    room-create: { burst: 20, every: 30s }
    room-join: { burst: 40, every: 3s }
    pack-create: { burst: 5, every: 6m }
    pack-change: { burst: 30, every: 10s }
    pack-lookup: { burst: 60, every: 1s }
  stomp-relay:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_STOMP_PORT:61613}
    login: ${RABBITMQ_USERNAME:guest}
    passcode: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
