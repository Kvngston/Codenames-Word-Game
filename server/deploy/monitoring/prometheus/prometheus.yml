# Scrapes the API's management port, Caddy and the VM, over the private Compose network.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: word-agents
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8081"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Every response as clients saw it, including 502s while the API is down.
  - job_name: caddy
    static_configs:
      - targets: ["caddy:2020"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
