# Production stack for a single VM: Caddy (HTTPS) -> Spring Boot, with MySQL,
# RabbitMQ and monitoring (Prometheus, Grafana at /grafana) on the private
# Compose network only. Run from this directory:
#   docker compose -f compose.prod.yaml up -d --build
name: word-agents

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      # Directories, not single files: git replaces files on checkout, and a
      # single-file mount would keep serving the old copy until a restart.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - grafana

  app:
    build: ..
    restart: unless-stopped
    # Each connected player holds ~0.5 MB (WebSocket + relay buffers). 1g was
    # OOM-killed at ~800 players under load; 3g held 4,000 in a load test.
    mem_limit: 3g
    # Written by ci-deploy.sh: the release tag this container was built from.
    env_file:
      - path: release.env
        required: false
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/wordagents
      DATABASE_USERNAME: wordagents
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in .env}
      # Set to false only while load testing from one machine.
      RATE_LIMITS_ENABLED: ${RATE_LIMITS_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordagents
      MYSQL_USER: wordagents
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uwordagents -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.1
    restart: unless-stopped
    # Every connected player holds one STOMP relay connection here, so one file
    # descriptor each. Docker's default soft limit (1024) capped the game at ~1,000 players.
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    environment:
      # RabbitMQ's default guest user only works from localhost, so a real user is required.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    configs:
      - source: rabbit-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_listener", "61613"]
      interval: 10s
      timeout: 10s
      retries: 30

  # ---- Monitoring (see monitoring/README.md) ----

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana-oss:12.1.1
    restart: unless-stopped
    mem_limit: 512m
    environment:
      GF_SERVER_ROOT_URL: https://${API_DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/word-agents.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # Host CPU, load, memory and disk.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave

configs:
  rabbit-plugins:
    content: "[rabbitmq_stomp,rabbitmq_prometheus]."

volumes:
  caddy-data:
  caddy-config:
  mysql-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
