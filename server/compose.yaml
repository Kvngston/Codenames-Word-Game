# Local MySQL and RabbitMQ (with STOMP) for running the server on your machine:
#   docker compose up -d && ./gradlew bootRun
# Add Prometheus (http://localhost:9090) and Grafana (http://localhost:3000) with:
#   docker compose --profile monitoring up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wordagents
      MYSQL_USER: wordagents
      MYSQL_PASSWORD: wordagents
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:4.1-management
    configs:
      - source: rabbit-plugins
        target: /etc/rabbitmq/enabled_plugins
    ports:
      - "61613:61613"
      - "15672:15672"
      - "15692:15692"

  # Same config as production; "app" resolves to the server running on the host.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    extra_hosts:
      - "app:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana-oss:12.1.1
    profiles: [monitoring]
    environment:
      # Local only: view dashboards without signing in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/word-agents.json
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

configs:
  rabbit-plugins:
    content: "[rabbitmq_management,rabbitmq_stomp,rabbitmq_prometheus]."

volumes:
  mysql-data:
